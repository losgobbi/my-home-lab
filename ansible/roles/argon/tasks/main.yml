---
# Installs Argon ONE M.2 power button + fan control support.
# Uses a vendored, reviewed copy of Argon40's official installer
# (files/argon1.sh) instead of `curl | bash` from their server at run
# time — this pins exactly what runs, regardless of what Argon may change
# upstream later. See ansible/roles/argon/files/argon1.sh for the one
# section we deliberately commented out (apt-get upgrade side effect +
# a PSU EEPROM script that's a no-op on Pi4 anyway) and why.

- name: Copy vendored Argon install script
  ansible.builtin.copy:
    src: argon1.sh
    dest: /tmp/argon1.sh
    mode: "0755"

- name: Run Argon install script (idempotent via creates guard)
  ansible.builtin.shell: /tmp/argon1.sh
  args:
    creates: /etc/argon/argon-config

- name: Ensure argononed service is enabled and running
  ansible.builtin.systemd:
    name: argononed.service
    state: started
    enabled: true
