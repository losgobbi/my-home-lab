---
- name: Ensure {{ storage_mount_path }} mount point directory exists
  ansible.builtin.file:
    path: "{{ storage_mount_path }}"
    state: directory
    mode: "0755"

- name: Ensure LABEL={{ storage_label }} filesystem is in fstab and mounted
  ansible.posix.mount:
    path: "{{ storage_mount_path }}"
    src: "LABEL={{ storage_label }}"
    fstype: "{{ storage_fstype }}"
    opts: defaults,nofail
    state: mounted
  # NOTE: this task fails loudly if no filesystem with this label exists yet.
  # That's intentional — it forces the manual `mkfs.ext4 -L storage /dev/sdX1`

- name: Ensure homelab subdirectories exist under {{ storage_mount_path }}
  ansible.builtin.file:
    path: "{{ storage_mount_path }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ storage_subdirs }}"
