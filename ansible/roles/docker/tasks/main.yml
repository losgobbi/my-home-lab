---
- name: Install Docker Engine + compose plugin (idempotent via creates guard)
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add ansible_user to the docker group (for manual interactive use)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
